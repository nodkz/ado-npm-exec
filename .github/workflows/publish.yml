name: publish

# Publishes to npm when package.json has a version that is not on npm yet:
# change "version" in package.json and merge to main. The workflow tests,
# publishes with provenance, then creates the v<version> tag and GitHub release.
# Authentication is npm trusted publishing (OIDC). npm only allows that for a
# package that already exists, so the very first publish uses an NPM_TOKEN
# repository secret (see README.md, "Publishing").

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch: # re-run by hand, e.g. after adding a secret

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      first: ${{ steps.check.outputs.first }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: check
        run: node scripts/publish-check.mjs

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # create the v<version> tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DIST_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm with trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm >= 11.5.1 is required for trusted publishing, found ${process.argv[1]}`);
              process.exit(1);
            }' "$(npm --version)"
      - name: A new package needs NPM_TOKEN for its first publish
        if: needs.check.outputs.first == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::This package is not on npm yet, and npm allows trusted publishing only for existing packages. Add an NPM_TOKEN repository secret for the first publish (README.md, Publishing), then re-run this workflow."
            exit 1
          fi
      # No dependency install: the package has no runtime dependencies, and
      # third-party code must not run in a job that can mint a publish token.
      # Type checking runs in ci.yml.
      - run: node --test
      - name: Publish to npm
        env:
          # Only used until trusted publishing is configured; empty afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          prerelease=()
          [ "$DIST_TAG" = latest ] || prerelease=(--prerelease)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes "${prerelease[@]}"
