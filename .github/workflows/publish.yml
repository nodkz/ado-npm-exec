name: publish

# Publishes to npmjs with trusted publishing (OIDC) and provenance when a
# GitHub release is published. No npm token is stored anywhere. One-time
# setup is described in README.md, "Publishing".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm with trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm >= 11.5.1 is required for trusted publishing, found ${process.argv[1]}`);
              process.exit(1);
            }' "$(npm --version)"
      - name: Require the release tag to match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version v$VERSION" >&2
            exit 1
          fi
      # No dependency install: the package has no runtime dependencies, and
      # third-party code must not run in a job that can mint a publish token.
      # Type checking runs in ci.yml.
      - run: node --test
      - run: npm publish --provenance --access public
